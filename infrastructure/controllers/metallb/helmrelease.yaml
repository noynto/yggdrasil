apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 30m
  chart:
    spec:
      chart: metallb
      version: ">=0.14.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    frr-k8s:
      prometheus:
        serviceMonitor:
          enabled: false
  # The statuscleaner uses hostNetwork, so on a single node its new pod cannot bind the webhook port
  # while the old one runs: stop the old pod first. The chart does not expose this strategy.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: metallb-frr-k8s-statuscleaner
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: metallb-frr-k8s-statuscleaner
              spec:
                strategy:
                  rollingUpdate:
                    maxSurge: 0
                    maxUnavailable: 1
