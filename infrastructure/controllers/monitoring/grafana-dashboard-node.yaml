apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-node
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  node.json: |
    {
      "title": "Node - frigg",
      "uid": "node-frigg",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "État actuel",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "description": "Valeurs instantanées pour un diagnostic rapide."
        },
        {
          "id": 2,
          "title": "Température max",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(node_hwmon_temp_celsius)"
            }
          ],
          "description": "Capteur hwmon le plus chaud actuellement (CPU, GPU intégré ou NVMe). Seuils : vert <70°C, orange 70-85°C, rouge >85°C."
        },
        {
          "id": 3,
          "title": "CPU",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)"
            }
          ],
          "description": "Utilisation CPU moyenne sur les 5 dernières minutes (100% - temps idle, tous cœurs confondus)."
        },
        {
          "id": 4,
          "title": "Mémoire",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 75
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)"
            }
          ],
          "description": "Mémoire utilisée = MemTotal - MemAvailable."
        },
        {
          "id": 5,
          "title": "Uptime",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "time() - node_boot_time_seconds"
            }
          ],
          "description": "Temps écoulé depuis le dernier démarrage du nœud. Une valeur basse inattendue signale un reboot récent."
        },
        {
          "id": 6,
          "title": "Température",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "description": "Capteurs matériels et état de limitation thermique."
        },
        {
          "id": 7,
          "title": "Températures (hwmon)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 16,
            "x": 0,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              },
              "custom": {
                "thresholdsStyle": {
                  "mode": "line"
                }
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(node_hwmon_temp_celsius * on(chip, sensor, instance) group_left(label) node_hwmon_sensor_label) * on(chip, instance) group_left(chip_name) node_hwmon_chip_names",
              "legendFormat": "{{chip_name}} - {{label}}"
            }
          ],
          "description": "Température de chaque capteur matériel : CPU (k10temp/Tctl), GPU intégré (amdgpu/edge), SSD NVMe (Composite/Sensor 1/Sensor 2)."
        },
        {
          "id": 8,
          "title": "Throttling CPU (cooling device)",
          "type": "state-timeline",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "mergeValues": true,
            "showValue": "never",
            "alignValue": "left",
            "rowHeight": 0.9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "node_cooling_device_cur_state",
              "legendFormat": "{{name}} {{type}}"
            }
          ],
          "description": "État de limitation thermique par cœur (vert = normal, rouge = throttling actif). À corréler avec le panneau de température."
        },
        {
          "id": 9,
          "title": "CPU & Système",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "description": "Utilisation, fréquence, charge et mémoire du nœud."
        },
        {
          "id": 10,
          "title": "Utilisation CPU",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 15
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "CPU %"
            }
          ],
          "description": "Pourcentage d'utilisation CPU moyen dans le temps, tous cœurs confondus."
        },
        {
          "id": 11,
          "title": "Fréquence CPU",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 15
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "hertz"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "avg(node_cpu_scaling_frequency_hertz)",
              "legendFormat": "moyenne"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "min(node_cpu_scaling_frequency_hertz)",
              "legendFormat": "min"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(node_cpu_scaling_frequency_hertz)",
              "legendFormat": "max"
            }
          ],
          "description": "Fréquence moyenne/min/max sur les 16 cœurs. Un grand écart entre min et max indique un déséquilibre de charge entre cœurs."
        },
        {
          "id": 12,
          "title": "Charge système (load average)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 23
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 16
                  }
                ]
              },
              "custom": {
                "thresholdsStyle": {
                  "mode": "line"
                }
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "node_load1",
              "legendFormat": "load1"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "node_load5",
              "legendFormat": "load5"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "node_load15",
              "legendFormat": "load15"
            }
          ],
          "description": "Nombre moyen de processus en attente de CPU ou d'E/S sur 1/5/15 min (pas un pourcentage). Ligne rouge = nombre de cœurs (16) : au-delà, le nœud est saturé."
        },
        {
          "id": 13,
          "title": "Mémoire utilisée",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 23
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)",
              "legendFormat": "mémoire %"
            }
          ],
          "description": "Pourcentage de mémoire utilisée dans le temps."
        },
        {
          "id": 14,
          "title": "Disque",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 31
          },
          "description": "Espace et débit du disque physique."
        },
        {
          "id": 15,
          "title": "Espace disque utilisé",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 32
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * (1 - node_filesystem_avail_bytes{mountpoint=~\"^/$|^/var$\"} / node_filesystem_size_bytes{mountpoint=~\"^/$|^/var$\"})",
              "legendFormat": "{{mountpoint}}"
            }
          ],
          "description": "Espace utilisé sur la seule partition réellement pertinente (/var) : Talos monte le reste du système en lecture seule."
        },
        {
          "id": 16,
          "title": "Débit disque (I/O)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 32
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "rate(node_disk_read_bytes_total{device=\"nvme0n1\"}[5m])",
              "legendFormat": "{{device}} lecture"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "rate(node_disk_written_bytes_total{device=\"nvme0n1\"}[5m])",
              "legendFormat": "{{device}} écriture"
            }
          ],
          "description": "Lecture/écriture sur le disque physique (nvme0n1) uniquement, exclut les volumes virtuels Longhorn (double comptage) et zram."
        },
        {
          "id": 17,
          "title": "Réseau",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 40
          },
          "description": "Débit de l'interface réseau physique."
        },
        {
          "id": 18,
          "title": "Réseau (débit)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 41
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bps"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "rate(node_network_receive_bytes_total{device!~\"lo|veth.*|docker.*|br-.*|.*tnl.*|sit.*|tunl.*\"}[5m]) * 8",
              "legendFormat": "{{device}} rx"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "rate(node_network_transmit_bytes_total{device!~\"lo|veth.*|docker.*|br-.*|.*tnl.*|sit.*|tunl.*\"}[5m]) * 8",
              "legendFormat": "{{device}} tx"
            }
          ],
          "description": "Débit entrant/sortant sur l'interface physique (eth0) uniquement, exclut les interfaces de tunnel du kernel (toujours à 0)."
        }
      ]
    }
