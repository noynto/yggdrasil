apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: worthfold-app
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes
  prune: true
  targetNamespace: worthfold
  sourceRef:
    kind: GitRepository
    name: worthfold
  dependsOn:
    - name: infrastructure-controllers
    - name: infrastructure-configs
  wait: true
  timeout: 5m
  # One tag for the Deployment and the bank-sync CronJob, which ship with ghcr.io/noynto/worthfold:latest.
  images:
    - name: ghcr.io/noynto/worthfold
      newTag: 1.5.1
