apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: worthfold-app
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes
  prune: true
  targetNamespace: worthfold
  sourceRef:
    kind: GitRepository
    name: worthfold
  dependsOn:
    - name: infrastructure-controllers
    - name: infrastructure-configs
  wait: true
  timeout: 5m
  # One tag for the Deployment and the bank-sync CronJob, which ship with ghcr.io/noynto/worthfold:latest.
  images:
    - name: ghcr.io/noynto/worthfold
      newTag: 1.1.1
  patches:
    # Kubernetes injects WORTHFOLD_PORT=tcp://<ip>:80 for the "worthfold" Service into every pod of the namespace.
    # The Deployment overrides it with WORTHFOLD_PORT=3000, the CronJob does not and exits with
    # "WORTHFOLD_PORT doit être un numéro de port". Stop the injection for the task.
    - patch: |
        apiVersion: batch/v1
        kind: CronJob
        metadata:
          name: worthfold-bank-sync
        spec:
          jobTemplate:
            spec:
              template:
                spec:
                  enableServiceLinks: false
      target:
        kind: CronJob
        name: worthfold-bank-sync
