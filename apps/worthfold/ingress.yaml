apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: worthfold
  namespace: worthfold
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - worthfold.noynto.me
      secretName: worthfold-tls
  rules:
    - host: worthfold.noynto.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worthfold
                port:
                  number: 80
