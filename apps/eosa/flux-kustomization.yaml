apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: eosa-app
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes
  prune: true
  targetNamespace: eosa
  sourceRef:
    kind: GitRepository
    name: eosa
  dependsOn:
    - name: infrastructure-controllers
    - name: infrastructure-configs
  wait: true
  timeout: 5m
  patches:
    - patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: eosa
        spec:
          template:
            spec:
              containers:
                - name: eosa
                  image: ghcr.io/noynto/eosa:1.15.1
              # TODO: drop this initContainers override once the eosa repo's own
              # kubernetes/deployment.yaml carries EOSA_MIGRATE_PRODUCTS_TO_JEWELS_TASK
              # on main (fix was lost in the PR #44 merge, see fix/missing-migration-task-env-var).
              initContainers:
                - name: create-admin
                  env:
                    - name: EOSA_MIGRATE_PRODUCTS_TO_JEWELS_TASK
                      value: "true"
      target:
        kind: Deployment
        name: eosa
    - patch: |
        apiVersion: apps/v1
        kind: StatefulSet
        metadata:
          name: mongodb
        spec:
          template:
            spec:
              securityContext:
                fsGroup: 999
      target:
        kind: StatefulSet
        name: mongodb