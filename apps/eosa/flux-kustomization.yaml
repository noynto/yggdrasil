apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: eosa-app
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes
  prune: true
  targetNamespace: eosa
  sourceRef:
    kind: GitRepository
    name: eosa
  dependsOn:
    - name: infrastructure-controllers
    - name: infrastructure-configs
  wait: true
  timeout: 5m
  images:
    - name: ghcr.io/noynto/eosa
      newTag: 1.28.0
  patches:
    - patch: |
        apiVersion: apps/v1
        kind: StatefulSet
        metadata:
          name: postgres
        spec:
          template:
            spec:
              securityContext:
                fsGroup: 999
      target:
        kind: StatefulSet
        name: postgres